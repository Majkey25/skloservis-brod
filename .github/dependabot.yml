# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '36 13 * * 2,5'
      timezone: Etc/UTC
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '50 17 * * 2,6'
      timezone: Etc/UTC
