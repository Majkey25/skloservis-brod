title_cs: O společnosti
title_en: About us
lead_cs: Sklo pro váš prostor, od návrhu po montáž.
lead_en: Glass for your space, from planning to installation.
body_cs: |
  SKLOSERVIS-BROD s.r.o. v Uherském Brodě nabízí české skleněné dveře, skleněná zábradlí, obklady a zástěny, sprchové kouty i sklenářské práce podle individuálních potřeb zákazníků. Poskytujeme komplexní služby od návrhu řešení přes zaměření a výrobu skleněných výrobků až po montáž a servis. Naše služby zajišťujeme pro Uherský Brod, celý Zlínský kraj i další kraje.

  I přes bohaté zkušenosti stojíme o nové výzvy a chceme společně se zákazníky objevovat nová řešení pro jejich interiéry a exteriéry. Sklo je moderním prvkem domácností i firemních prostor. Představíme vám ho nejen jako luxusní, ale také funkční a praktickou součást každodenního života.
body_en: |
  Based in Uherský Brod, SKLOSERVIS-BROD s.r.o. offers Czech-made glass doors, railings, splashbacks and screens, shower enclosures and glassworking tailored to each customer's needs. Our service covers planning, measuring and manufacture through to installation and servicing. We serve Uherský Brod, the whole Zlín Region and other regions.

  With extensive experience behind us, we still welcome new challenges and enjoy exploring new solutions for interiors and exteriors with our customers. Glass brings a modern touch to homes and business premises. We will help you make it a practical and functional part of everyday life, as well as an elegant one.
