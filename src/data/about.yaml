service_groups:
  - id: processing
    title_cs: Kompletní úpravy skla a zasklívání
    title_en: Glass processing and glazing
    summary_cs: Provádíme veškeré úpravy a opracování skla a skleněných výrobků včetně zasklívání a montáže na míru.
    summary_en: We process and finish glass and glass products, including made-to-measure glazing and installation.
    text_cs: Řezání, vrtání, pískování, broušení a další úpravy skla a skleněných výrobků. Zasklívání nových i stávajících otvorů dle potřeb zákazníka.
    text_en: Cutting, drilling, sandblasting, grinding and other glass finishing. Glazing for new and existing openings, tailored to your needs.
    link: services
  - id: doors
    title_cs: Výroba a montáž skleněných dveří
    title_en: Glass door manufacture and installation
    summary_cs: Vyrábíme skleněné dveře do interiéru i exteriéru, včetně povrchových úprav a montáže.
    summary_en: We manufacture glass doors for interiors and exteriors, including surface finishes and installation.
    text_cs: Každé skleněné dveře jsou vyrobeny na míru pro konkrétní prostor, tvoří opravdový originál a moderní součást interiéru i exteriéru.
    text_en: Each glass door is made to measure for its space, creating an individual, modern feature for interiors and exteriors.
    link: sklenene-dvere
  - id: showers
    title_cs: Skleněné sprchové kouty a obklady
    title_en: Glass shower enclosures and splashbacks
    summary_cs: Vyrábíme skleněné obklady a zástěny nejen do koupelny a kuchyně. Včetně montáže a servisu.
    summary_en: We manufacture glass splashbacks and screens for bathrooms, kitchens and other spaces, with installation and servicing.
    text_cs: Kompletní dodávka a instalace sprchových koutů, koupelnových zástěn a skleněných obkladů nejen do koupelny.
    text_en: Complete supply and installation of shower enclosures, bathroom screens and glass wall coverings for bathrooms and beyond.
    link: skleneny-sprchovy-kout
  - id: structures
    title_cs: Skleněné zábradlí, stěny a markýzy
    title_en: Glass railings, partitions and canopies
    summary_cs: Skleněné zábradlí a stěny jsou součástí moderního designu. Zajišťujeme také montáž a servis.
    summary_en: Glass railings and partitions bring a modern design to your space. We also provide installation and servicing.
    text_cs: Zaměření, výroba a montáž skleněných stěn, příček, zábradlí, markýz a dalších stavebních prvků pro interiéry i exteriéry.
    text_en: Measuring, manufacture and installation of glass walls, partitions, railings, canopies and other architectural features for interiors and exteriors.
    link: sklenene-zabradli
special_glass_title_cs: Speciální skla pro vaše řešení
special_glass_title_en: Specialist glass for your project
special_glass_text_cs: K našim sklenářským pracím patří také bezpečnostní skla, izolační dvojskla a trojskla různých optických a tepelných vlastností, neprůstřelná a protipožární skla. Vhodné provedení s vámi probereme podle konkrétního zadání.
special_glass_text_en: Our range also includes safety and security glass, insulating double and triple glazing with different optical and thermal properties, bullet-resistant glass and fire-resistant glass. We will discuss a suitable specification for your particular project.
consultation_title_cs: Návrh, kalkulace a zaměření zdarma
consultation_title_en: Free planning, quotation and measuring
consultation_text_cs: Máte-li zájem o sklenářské práce, kontaktujte nás s nezávaznou poptávkou. Na základě vaší představy vám předložíme návrh řešení, vypracujeme podrobnou cenovou kalkulaci a poskytneme odborné poradenství. Tyto služby jsou zdarma, včetně zaměření prostoru před realizací zakázky. Po doladění zadání vyrobíme skleněné výrobky na míru, v dohodnutém termínu je dopravíme a namontujeme.
consultation_text_en: Contact us with a no-obligation enquiry about your glass project. Based on your ideas, we will propose a solution, prepare a detailed quotation and provide expert advice. These services are free, including measuring the space before the project begins. Once the details are agreed, we manufacture your glass to measure, deliver it at the agreed time and install it.
