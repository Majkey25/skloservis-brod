title_cs: O společnosti
title_en: About us
lead_cs: Sklo pro váš prostor, od návrhu po montáž.
lead_en: Glass for your space, from planning to installation.
body_cs: |
  SKLOSERVIS-BROD s.r.o. v Uherském Brodě se věnuje sklenářským pracím a výrobě skleněných výrobků na míru. Nabízíme dveře, zábradlí, obklady, příčky i sprchové kouty pro domácnosti a firemní prostory.

  Součástí spolupráce je návrh řešení, zaměření, výroba, doprava, montáž a servis. Zajišťujeme také opracování skla a zasklívání. Možnosti realizace ve vašem místě s vámi rádi probereme.
body_en: |
  Based in Uherský Brod, SKLOSERVIS-BROD s.r.o. specialises in glassworking and made-to-measure glass products. We offer doors, railings, splashbacks, partitions and shower enclosures for homes and business premises.

  Our work covers planning, measuring, manufacture, delivery, installation and servicing. We also offer glass processing and glazing. Contact us to discuss the possibilities for your project location.
