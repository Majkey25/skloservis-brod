# Historical Czech paths and explicit English equivalents are documented in docs/routes.md.
# Offerings and product options paraphrased from owner-confirmed corresponding WP pages.
- slug: sklenene-dvere
  slug_en: glass-doors
  title_cs: Skleněné dveře
  title_en: Glass doors
  text_cs: Vyrábíme skleněné dveře na míru pro interiéry i exteriéry. Podle prostoru lze zvolit posuvné, otočné nebo kyvné provedení a čiré či matované sklo. Součástí zakázky může být zaměření, povrchové úpravy a montáž.
  text_en: We make glass doors to measure for indoor and outdoor spaces. Depending on the space, options include sliding, hinged or swing doors and clear or frosted glass. Measuring, surface finishes and installation can be included in the project.
  details:
    - title_cs: Otevírání a kování
      title_en: Opening options and fittings
      text_cs: Posuvné dveře mohou kombinovat pevné a posuvné panely s tlumeným dojezdem na obě strany. Otočné dveře lze osadit do hliníkových i běžných zárubní a obložek. Kyvné dveře nabízíme jednokřídlé i dvoukřídlé se samozavíracím hydraulickým závěsem.
      text_en: Sliding doors can combine fixed and sliding panels with soft-close fittings in both directions. Hinged doors can fit aluminium or conventional door frames. Pivot doors are available with one or two leaves and self-closing hydraulic hinges.
    - title_cs: Sklo a zamykání
      title_en: Glass finishes and locks
      text_cs: Nabízíme čiré, kouřové i matované kalené sklo. Matování poskytuje více soukromí a propouští světlo. Dveře lze doplnit zamykáním.
      text_en: Options include clear, smoked and frosted tempered glass. Frosting offers more privacy while letting light through. Locks can also be fitted.
  seo_title_cs: Skleněné dveře na míru, posuvné i kyvné
  seo_title_en: Made-to-measure glass doors, sliding or swing
  seo_description_cs: Skleněné dveře na míru do interiéru i exteriéru. Posuvné, otočné a kyvné provedení, čiré nebo matované sklo. Návrh a zaměření zdarma, poté výroba a montáž ze sklenářství v Uherském Brodě.
  seo_description_en: Made-to-measure glass doors for indoor and outdoor spaces. Sliding, hinged or swing options, clear or frosted glass. Free planning and measuring, then manufacture and installation by our Uherský Brod workshop.
- slug: sklenene-zabradli
  slug_en: glass-railings
  title_cs: Skleněné zábradlí
  title_en: Glass railings
  text_cs: Skleněné zábradlí navrhujeme podle místa použití a možností uchycení. Probereme s vámi provedení skla i kotvení pro schodiště, balkon nebo terasu a zajistíme zaměření, výrobu a montáž.
  text_en: We plan glass railings around their location and fixing requirements. We will discuss glass and mounting options for your staircase, balcony or terrace, then arrange measuring, manufacture and installation.
  details:
    - title_cs: U-profil a bodové úchyty
      title_en: U-channel and point fixings
      text_cs: Spodní kotvicí U-profil se hodí pro rovné části zábradlí, například podesty a terasy. Při stavební přípravě jej lze zapustit do podlahy. Bodové úchyty, takzvané terče, umožňují kotvení na rovných úsecích i schodištích.
      text_en: A bottom U-channel suits straight sections such as landings and terraces. It can be recessed into the floor during construction. Point fixings can be used for both straight sections and staircases.
    - title_cs: Sloupkové a předokenní zábradlí
      title_en: Post railings and window guards
      text_cs: Skleněnou výplň sloupkového zábradlí drží úchyty a lze ji kombinovat s kovovým i dřevěným zábradlím. Předokenní zábradlí pro francouzská okna se kotví po stranách do hliníkového profilu.
      text_en: Post railings hold glass infill with clamps and can combine glass with metal or wooden railings. Guards for full-height windows use aluminium profiles fixed at the sides.
    - title_cs: Sklo pro zábradlí
      title_en: Glass for railings
      text_cs: Pro zábradlí používáme bezpečnostní lepené sklo.
      text_en: We use laminated safety glass for railings.
  seo_title_cs: Skleněné zábradlí na míru pro schody a balkony
  seo_title_en: Glass railings for stairs and balconies
  seo_description_cs: Skleněné zábradlí na míru pro schodiště, balkony a terasy. Bezpečnostní lepené sklo, sloupky, U-profily nebo bodové úchyty. Návrh uchycení a zaměření zdarma, poté výroba a montáž.
  seo_description_en: Made-to-measure glass railings for stairs, balconies and terraces in laminated safety glass. Post, U-channel or point fixings. Free measuring, then manufacture and installation.
- slug: skleneny-sprchovy-kout
  slug_en: glass-shower-enclosures
  title_cs: Skleněný sprchový kout
  title_en: Glass shower enclosures
  text_cs: Sprchové kouty a zástěny vyrábíme na míru konkrétní koupelně. Rozměry, uspořádání dveří a provedení skla řešíme podle dispozice prostoru. Zajistíme zaměření a montáž.
  text_en: We make shower enclosures and screens to fit individual bathrooms. Dimensions, door arrangements and glass finishes are planned around the available space. We provide measuring and installation.
  details:
    - title_cs: Rámové i bezrámové provedení
      title_en: Framed and frameless options
      text_cs: Nabízíme sprchové kouty z kaleného skla tloušťky 8 mm s rámovou konstrukcí nebo bezrámovým kováním. Vedle čirého skla lze zvolit tónované nebo vzorované provedení pro více soukromí.
      text_en: We offer shower enclosures in 8 mm tempered glass with framed construction or frameless fittings. Alongside clear glass, tinted or patterned finishes offer more privacy.
  seo_title_cs: Sprchový kout na míru, bezrámový i rámový
  seo_title_en: Made-to-measure glass shower enclosures
  seo_description_cs: Sprchový kout a zástěny na míru vaší koupelně. Rámové i bezrámové provedení z kaleného skla 8 mm, čiré, tónované nebo vzorované sklo. Zaměření zdarma, montáž podle prostoru.
  seo_description_en: Made-to-measure glass shower enclosures and bathroom screens. Framed or frameless 8 mm tempered glass in clear, tinted or patterned finishes. Free measuring, then installation to fit your bathroom.
- slug: sklenena-stena
  slug_en: glass-partitions
  title_cs: Skleněná stěna
  title_en: Glass partitions
  text_cs: Skleněné stěny a příčky rozdělují obytné i kancelářské prostory a propouštějí světlo. Nabízíme čiré, matované i dekorované provedení a kombinace se skleněnými dveřmi. Řešení přizpůsobíme danému prostoru.
  text_en: Glass walls and partitions divide living and office spaces while allowing light through. Options include clear, frosted and decorated glass, combined with glass doors where required. Each solution is planned for its space.
  details:
    - title_cs: Povrchové úpravy a dveře
      title_en: Surface finishes and doors
      text_cs: Matované nebo vzorované sklo pomáhá oddělit soukromou část místnosti. Dekor lze vytvořit pískováním nebo lepením fólií. Stěnu můžeme kombinovat s posuvnými i otočnými skleněnými dveřmi.
      text_en: Frosted or patterned glass helps screen off a private area. Decorative finishes can use sandblasting or applied films. Partitions can be combined with sliding or hinged glass doors.
  seo_title_cs: Skleněné příčky a stěny na míru
  seo_title_en: Made-to-measure glass partitions and walls
  seo_description_cs: Skleněné příčky a stěny na míru do bytů i kanceláří. Čiré, matované, pískované nebo dekorované sklo propouští světlo, možnost posuvných i otočných dveří. Zaměření zdarma.
  seo_description_en: Made-to-measure glass walls and partitions for homes and offices. Clear, frosted, sandblasted or decorated glass lets light through, with sliding or hinged doors and free measuring.
- slug: skleneny-obklad-do-kuchyne
  slug_en: glass-kitchen-splashbacks
  title_cs: Skleněný obklad do kuchyně
  title_en: Glass kitchen splashbacks
  text_cs: Skleněný obklad za kuchyňskou linku vyrábíme podle rozměrů vaší kuchyně. Hladký povrch bez spár usnadňuje čištění. Barvu, otvory a návaznost na pracovní desku probereme při návrhu a zaměření.
  text_en: We make glass splashbacks to fit your kitchen. The smooth surface without grout joints is easy to clean. Colour, cut-outs and the fit with your worktop are discussed during planning and measuring.
  details:
    - title_cs: Kalené sklo a barva
      title_en: Tempered glass and colour
      text_cs: Obklady vyrábíme z kaleného skla tloušťky 6 mm. Zadní stranu lakujeme barvou podle vašeho výběru, aby obklad ladil s kuchyní.
      text_en: We make splashbacks from 6 mm tempered glass. The back is painted in your chosen colour to match the kitchen.
  seo_title_cs: Sklo za kuchyňskou linku na míru
  seo_title_en: Glass kitchen splashbacks made to measure
  seo_description_cs: Sklo za kuchyňskou linku na míru. Skleněný obklad z kaleného skla 6 mm v barvě podle výběru, hladký povrch bez spár a otvory podle kuchyně. Návrh a zaměření zdarma, poté montáž.
  seo_description_en: Made-to-measure glass kitchen splashbacks in 6 mm tempered glass, painted in your chosen colour. A smooth surface without grout joints and planned cut-outs. Free planning and measuring, then installation.
- slug: sklenene-strisky-zaskleni-pergol-zastreseni
  slug_en: glass-canopies-pergola-glazing
  title_cs: Skleněné stříšky, zasklení pergol, zastřešení
  title_en: Glass canopies and pergola glazing
  text_cs: Nabízíme skleněné stříšky nad vstupy, zastřešení a zasklení pergol. Pro zasklení lze podle konstrukce řešit pevné nebo posuvné panely. Konkrétní podobu a montáž navrhneme podle místa realizace.
  text_en: We offer glass entrance canopies, roofing and pergola glazing. Depending on the structure, glazing can use fixed or sliding panels. The design and installation are planned for the project location.
  seo_title_cs: Skleněné stříšky, zastřešení a zasklení pergol
  seo_title_en: Glass canopies, roofing and pergola glazing
  seo_description_cs: Skleněné stříšky nad vchod, zastřešení a zasklení pergol na míru. Pevné nebo posuvné panely podle konstrukce. Návrh a zaměření zdarma, montáž přizpůsobíme místu realizace.
  seo_description_en: Made-to-measure glass entrance canopies, roofing and pergola glazing. Fixed or sliding panels to suit the structure. Free planning and measuring; installation is planned for the site.
- slug: sklenene-dekorace-gravirovani-fotek
  slug_en: glass-decorations-photo-engraving
  title_cs: Skleněné dekorace, gravírování fotek
  title_en: Glass decorations and photo engraving
  text_cs: Vyrábíme skleněné dekorace a drobné doplňky, například tácky, hodiny nebo cedulky. Laserové gravírování umožňuje přenést na sklo text i fotografie. Podobu dekorace a vhodný podklad s vámi probereme.
  text_en: We make glass decorations and small accessories such as coasters, clocks and signs. Laser engraving can reproduce text and photographs on glass. We will discuss the design and a suitable glass item with you.
  details:
    - title_cs: Zdobení skla a osobní dárky
      title_en: Glass decoration and personal gifts
      text_cs: Laserové gravírování kombinujeme s pískováním a lakováním. Nabízíme také lahve a sklenice se jménem či věnováním, skleněné tácy a vizitky.
      text_en: We combine laser engraving with sandblasting and painting. We also offer bottles and drinking glasses with names or dedications, glass trays and glass business cards.
  seo_title_cs: Gravírování fotek do skla a skleněné dekorace
  seo_title_en: Photo engraving on glass and glass decorations
  seo_description_cs: Laserové gravírování fotografií i textu do skla a skleněné dekorace. Tácky, hodiny, cedulky, lahve nebo sklenice se jménem či věnováním. Podobu a vhodný podklad probereme podle zadání.
  seo_description_en: Glass decorations and laser engraving of photographs and text. Coasters, clocks, signs, bottles and drinking glasses with dedications. We discuss the design and a suitable glass item.
- slug: sklenene-nahrobni-desky
  slug_en: glass-memorial-plaques
  title_cs: Skleněné náhrobní desky
  title_en: Glass memorial plaques
  text_cs: Skleněné náhrobní desky vyrábíme v rozměrech podle zadání. Na sklo lze laserem gravírovat nápisy i fotografie. Rozměry, podobu textu a přípravu fotografie domluvíme individuálně.
  text_en: We make glass memorial plaques to the requested dimensions. Inscriptions and photographs can be laser engraved on the glass. Dimensions, wording and photograph preparation are discussed individually.
  details:
    - title_cs: Černé sklo
      title_en: Black glass
      text_cs: Pro náhrobní desky standardně používáme černé sklo tloušťky 6 nebo 8 mm.
      text_en: Our standard memorial plaques use black glass in 6 or 8 mm thicknesses.
  seo_title_cs: Skleněné náhrobní desky s fotografií
  seo_title_en: Glass memorial plaques with photographs
  seo_description_cs: Skleněné náhrobní desky na míru s laserově gravírovaným nápisem nebo fotografií. Standardně používáme černé sklo 6 nebo 8 mm; provedení a podklady pro gravírování probereme při poptávce.
  seo_description_en: Made-to-measure glass memorial plaques with laser-engraved text or photographs. Normally black glass in 6 or 8 mm thicknesses, with dimensions and image preparation agreed individually.
