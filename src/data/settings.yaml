services_text_cs: Nabízíme řezání, vrtání, pískování a broušení skla, zasklívání i montáž skleněných výrobků. Pomůžeme s návrhem řešení a zaměřením.
services_text_en: We offer glass cutting, drilling, sandblasting and grinding, glazing and installation of glass products. We can help with planning and measuring.
process_cs: Napište nám svou představu a místo realizace. Probereme návrh řešení, zaměření a cenovou nabídku. Po odsouhlasení podoby zakázky následuje výroba na míru, doprava a montáž v dohodnutém termínu.
process_en: Tell us about your idea and the project location. We will discuss a proposed solution, measuring and a quotation. Once the details are agreed, we manufacture the glass to measure and arrange delivery and installation.
