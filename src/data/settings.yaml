name: SKLOSERVIS-BROD s.r.o.
contact_email: skloservis.brod@gmail.com
hero_title_cs: Sklenářství na míru v Uherském Brodě
hero_title_en: Made-to-measure glass in Uherský Brod
hero_text_cs: 'Naše sklenářství v Uherském Brodě vyrábí sklo na míru: dveře,
  zábradlí, sprchové kouty, obklady a příčky. Od návrhu a zaměření po montáž a servis.'
hero_text_en: 'Made-to-measure glass from our workshop in Uherský Brod: doors,
  railings, shower enclosures, splashbacks and partitions. From planning and
  measuring to installation and servicing.'
products_title_cs: Skleněné výrobky na míru
products_title_en: Made-to-measure glass products
products_text_cs: 'Skleněné výrobky na míru: dveře, zábradlí, sprchové kouty,
  příčky, kuchyňské obklady, zastřešení a gravírované sklo. Provedení přizpůsobíme
  vašemu prostoru a zadání.'
products_text_en: 'Made-to-measure glass products: doors, railings, shower
  enclosures, partitions, kitchen splashbacks, roofing and engraved glass. We
  tailor each project to your space and requirements.'
services_title_cs: Sklenářské práce na míru
services_title_en: Glassworking and glazing services
services_text_cs: Sklenářské práce na míru zahrnují řezání, vrtání, pískování
  a broušení skla, zasklívání i montáž skleněných výrobků. Pomůžeme vám s návrhem
  řešení a zaměřením prostoru.
services_text_en: Our glassworking and glazing services cover cutting,
  drilling, sandblasting, grinding and glazing, plus installation of glass products.
  We can help with planning and measuring your space.
process_cs: Napište nám svou představu a místo realizace. Probereme návrh
  řešení, zaměření a cenovou nabídku. Po odsouhlasení podoby zakázky následuje
  výroba na míru, doprava a montáž v dohodnutém termínu.
process_en: Tell us about your idea and the project location. We will discuss a
  proposed solution, measuring and a quotation. Once the details are agreed, we
  manufacture the glass to measure and arrange delivery and installation.
gallery_title_cs: Ukázky sklenářských prací
gallery_title_en: Glasswork gallery
gallery_text_cs: 'Prohlédněte si ukázky sklenářských prací: zábradlí, sprchové
  kouty, příčky, obklady, dveře a zastřešení. V úplné galerii můžete fotografie
  filtrovat podle výrobku a otevřít v detailu.'
gallery_text_en: 'Explore our glasswork gallery: railings, shower enclosures,
  partitions, splashbacks, doors and roofing. In the full gallery, filter photographs
  by product and open each image for a closer look.'
footer_text_cs: Sklenářské práce, výroba a montáž skla na míru. Uherský Brod.
footer_text_en: Glassworking, made-to-measure manufacture and installation. Uherský Brod.
seo_title_cs: Sklenářství Uherský Brod – sklo na míru | Skloservis Brod
seo_title_en: Made-to-measure glass in Uherský Brod | Skloservis Brod
seo_description_cs: 'Sklenářství v Uherském Brodě: skleněné dveře, zábradlí,
  sprchové kouty, příčky a kuchyňské obklady na míru. Návrh, zaměření, výroba,
  montáž a servis skleněných výrobků.'
seo_description_en: 'Made-to-measure glass from our Uherský Brod workshop:
  doors, railings, shower enclosures, partitions and kitchen splashbacks,
  with measuring, manufacture and installation.'
