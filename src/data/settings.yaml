name: SKLOSERVIS-BROD s.r.o.
contact_email: skloservis.brod@gmail.com
hero_title_cs: Sklenářství na míru v Uherském Brodě
hero_title_en: Made-to-measure glass in Uherský Brod
hero_text_cs: Skleněné dveře, zábradlí, sprchové kouty, obklady a příčky. Od
  návrhu a zaměření přes výrobu až po montáž a servis.
hero_text_en: Glass doors, railings, shower enclosures, splashbacks and
  partitions. From planning and measuring to manufacture, installation and
  servicing.
products_title_cs: Skleněné výrobky na míru
products_title_en: Made-to-measure glass products
products_text_cs: Skleněné dveře, zábradlí, sprchové kouty, příčky, kuchyňské
  obklady, zastřešení a gravírované sklo na míru. Provedení přizpůsobíme vašemu
  prostoru a zadání.
products_text_en: Made-to-measure glass doors, railings, shower enclosures,
  partitions, kitchen splashbacks, roofing and engraved glass. We tailor each
  project to your space and requirements.
services_title_cs: Sklenářské práce na míru
services_title_en: Glassworking and glazing services
services_text_cs: Nabízíme řezání, vrtání, pískování a broušení skla, zasklívání
  i montáž skleněných výrobků. Pomůžeme s návrhem řešení a zaměřením.
services_text_en: We offer glass cutting, drilling, sandblasting and grinding,
  glazing and installation of glass products. We can help with planning and
  measuring.
process_cs: Napište nám svou představu a místo realizace. Probereme návrh
  řešení, zaměření a cenovou nabídku. Po odsouhlasení podoby zakázky následuje
  výroba na míru, doprava a montáž v dohodnutém termínu.
process_en: Tell us about your idea and the project location. We will discuss a
  proposed solution, measuring and a quotation. Once the details are agreed, we
  manufacture the glass to measure and arrange delivery and installation.
gallery_title_cs: Ukázky sklenářských prací
gallery_title_en: Glasswork gallery
gallery_text_cs: Vybrané ukázky skleněných zábradlí, sprchových koutů, příček,
  obkladů, dveří a zastřešení. Podrobnosti najdete na stránkách jednotlivých
  výrobků.
gallery_text_en: Selected examples of glass railings, shower enclosures,
  partitions, splashbacks, doors and roofing. Find details on the individual
  product pages.
footer_text_cs: Sklenářské práce, výroba a montáž skla na míru. Uherský Brod.
footer_text_en: Glassworking, made-to-measure manufacture and installation. Uherský Brod.
